accelerator: 'auto'
devices: 'auto'
max_epochs: 5
seed: null
training:
  out_dir: './out'
  logfile: 'log.txt'
  criterion: 'CCE'
  precision: '16-mixed'
  checkpoints:
    save_top_k: 3
    monitor: 'val loss'
    mode: 'min'
    filename: '{epoch}'
data:
  path_to_image_root: './data'
  batch_size: 128
  num_workers: 16
  pin_memory: True
  persistent_workers: False
  image_resolution: 224
  augmentation:
    validation_crop_ratio: 0.875
    use_color_jitter: True
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
optimizer:
  name: 'SGD'
  kwargs:
    lr: 1.0e-1
    weight_decay: 1.0e-4
    momentum: 0.9
  gradient_clip_val: 1.0
scheduler:
  num_warmup_epochs: 0
  name: null
  kwargs: {}
model:
  compile: False
  name: 'resnet18'
  kwargs: {}
metrics: ['Accuracy', 'Mean IoU',]
num_classes: 1000