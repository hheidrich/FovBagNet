[project]
name = "fovbagnet"
version = "1.0.0"
authors = [
  { name="Holger Heidrich", email="holger.heidrich@uni-tuebingen.de" },
]
description = 'Research code for reproducing the results of the paper "Foveated BagNet: Inherent Interpretability Does Not Exclude Global Context."'

readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

requires-python = ">=3.14"
dependencies = [
    "lightning>=2.5.2",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "standard-imghdr>=3.13.0",
    "tensorboard>=2.19.0",
    "torch>=2.7.0",
    "torchmetrics>=1.7.3",
    "torchvision>=0.22.1",
    "scipy>=1.16.0",
    "psutil>=5.9.0",
    "tqdm>=4.67.1",
    "ruff>=0.15.21",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Tell setuptools to look in the `src` directory
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
combine-as-imports = true

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]
